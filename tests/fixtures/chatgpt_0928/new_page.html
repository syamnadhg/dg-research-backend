<!--
  ChatGPT's NEW page (2026-09-28), rebuilt from the owner's captures in this folder:
    * chatgpt-reply-capture2.json     — the sent user block and ChatGPT's reply
      block, tag / attribute / class / nesting, and the chain of ancestors above
      them (class values are cut at ~100 characters by the capture tool and are
      reproduced exactly as captured, cut included);
    * chatgpt-composer-capture-trimmed.json — the message box, the model button,
      the model menu with its "Select model" and "Power" rows and the slider thumb,
      and where focus goes when the menu closes (the model button — never the box);
    * chatgpt-thread-capture.json     — the composer's action button: "Start Voice"
      while the box is empty, "Send" (type=submit) once it holds text, "Stop"
      while a reply is generating.
  NOT in any capture, and therefore kept generic on purpose: the heading and the
  link inside the reply (plain <h2>/<a>), the placeholder paragraph inside the box
  (the live probe read 'ask chatgpt' from a descendant [data-placeholder]), and
  where the form sits relative to the transcript.

  The script below only animates what the captures recorded: typing swaps
  Start Voice for Send, sending appends the user block, shows Stop, then appends
  the reply; the model button opens and Escape closes the menu, leaving focus on
  the button. body[data-sr-fixture="thread"] loads a finished exchange with Stop
  still showing (a reply "generating"). TEST HOOKS, not page behaviour:
  body[data-mangle="N"] — the next N inserts lose their first character, so the
  read-back check can be exercised; body[data-richtext] — the box curls
  apostrophes and turns "- " lines into bullets; body[data-sendmangle] — Send posts the text
  minus its first character; body[data-menu-closed-by] / [data-sent-via] record
  how the menu closed (escape / outside) and how the message went (button /
  enter). body[data-attach] — every user message carries a file card ABOVE its
  text, inside the bubble's own flex column (NOT captured: no capture holds an
  attachment, so the card goes where it would hurt most; its name line also
  carries whitespace-pre-wrap); body[data-streaming] — after a send Stop stays
  up (the reply is still being written).
  WAVE 13 HOOKS (Phase 1's Copy fallback): body[data-reply-actions] — every reply
  gets the row of icons under it: Copy, Share, Read aloud, Regenerate response,
  More actions. The labels and attributes are the capture's ("buttons" in
  chatgpt-reply-capture2.json); WHERE the row sits is NOT captured — it is
  ASSUMED to be inside the reply's .block-BQZwFn, right after the reply unit,
  the way the user's own row sits inside the user block. Its Copy writes the
  reply's markdown to the clipboard (body[data-copy-gives]: "nothing" writes
  nothing, "prompt" writes the last user message, "cited" adds a citation-token
  run). body[data-reply-renamed] — a future rename: the reply's text root loses
  every marker, so the page read comes back empty. body[data-clicked] records
  each click on a button outside the composer, by its data-sr-name or aria-label; body[data-replies] counts
  the replies drawn.
-->

<!-- The reply's text. Paragraphs as captured (p.Paragraph-* > span); the heading

<template id="sr-reply"><h2>Research brief: the St Bernard</h2><p class="Paragraph-kKnbIo" dir="auto"><span>Scope: the breed's history in the Alps, its rescue work at the Great St Bernard Pass, health and temperament, and today's breeding standards. The report should separate what the historical record supports from the legends that grew around the breed in the nineteenth century, and it should say plainly where the two cannot be told apart.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Start from the breed standard at <a href="https://example.org/st-bernard-breed-standard" target="_blank" rel="noopener">the breed standard page</a> and the hospice archives, then work outwards to the kennel club registries, veterinary literature on giant breeds, and first-hand accounts from the monks and travellers who crossed the pass before the tunnel opened.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Questions to answer: when the hospice first kept dogs and for what work; how the rescue reputation formed and which rescues are documented; how the short-haired and long-haired varieties diverged; what the modern standard requires and why it changed; which health problems are most common and what screening breeders use; and how life expectancy compares with other giant breeds.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Method: prefer primary sources and peer-reviewed veterinary studies; quote dates and numbers with their source; where sources disagree, give both and say which is better supported. Keep marketing material and breeder advertising out of the evidence, and flag any figure that appears only in popular articles.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Structure: an executive summary of no more than one page; a history section; a section on working roles past and present; a health and welfare section with a table of conditions, prevalence and screening; a section on the breed standard; and a closing list of open questions the evidence could not settle.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Out of scope: other mastiff-type breeds except where a comparison explains a St Bernard trait; training advice; and product recommendations of any kind. If a source discusses the breed only in passing, cite it only for the point it actually makes, and do not let a single anecdote stand in for a pattern.</span></p><p class="Paragraph-kKnbIo" dir="auto"><span>Deliverable: a structured report with sections, sources and open questions for the research agent to pursue, written for a reader who knows dogs but not this breed, with every claim traceable to a cited source.</span></p></template>

<script>
(() => {
  const BTN = 'cursor-interaction size-token-button-composer flex items-center justify-center rounded-ful';
  const EMPTY = '<p data-placeholder="Ask ChatGPT"><br></p>';
  const box = document.querySelector('div.ProseMirror');
  const slot = document.getElementById('sr-action');
  const transcript = document.getElementById('sr-transcript');
  const modelBtn = document.getElementById('radix-_r_4k_');
  const layer = document.getElementById('sr-menu-layer');
  const text = () => (box.innerText || '').split(String.fromCharCode(0x200b)).join('').trim();
  const clone = (id) => document.getElementById(id).content.cloneNode(true);

  function setAction(kind) {
    if (kind === 'send') {
      slot.innerHTML = '<button type="submit" class="' + BTN + '" aria-label="Send"><svg></svg></button>';
    } else if (kind === 'stop') {
      slot.innerHTML = '<button type="button" class="' + BTN + '" aria-label="Stop"><svg></svg></button>';
    } else {
      slot.innerHTML = '<button type="button" class="' + BTN + '" aria-label="Start Voice" data-state="closed"><svg></svg></button>';
    }
  }
  function fileCard() {
    const c = document.createElement('div');
    c.innerHTML = '<div class="truncate font-semibold whitespace-pre-wrap">St_Bernard_notes.pdf</div>'
      + '<div class="truncate">PDF</div>';
    return c;
  }
  function addExchange(userText, withReply) {
    const turn = clone('sr-turn');
    const col = turn.querySelector('div[class="flex flex-col gap-3 browser:gap-1"]');
    const user = clone('sr-user-block');
    user.querySelector('div[dir="auto"]').textContent = userText;
    if (document.body.dataset.attach) {
      const inBubble = user.querySelector('[data-user-message-bubble="true"] > div');
      inBubble.insertBefore(fileCard(), inBubble.firstChild);
    }
    col.appendChild(user);
    transcript.appendChild(turn);
    const addReply = () => {
      const a = clone('sr-assistant-block');
      const root = a.querySelector('[data-markdown-text-style]');
      root.appendChild(clone('sr-reply'));
      if (document.body.dataset.replyRenamed) {
        // TEST HOOK: a future rename — no marker names the reply's text any more.
        root.removeAttribute('data-markdown-text-style');
        root.className = 'Answer-x1';
      }
      if (document.body.dataset.replyActions) a.firstElementChild.appendChild(clone('sr-reply-actions'));
      col.appendChild(a);
      document.body.dataset.replies = String(parseInt(document.body.dataset.replies || '0', 10) + 1);
    };
    if (withReply) addReply();
    return addReply;
  }
  function send(via) {
    const t = text();
    if (!t) return;
    document.body.dataset.sentVia = via;
    // TEST HOOK: the page posts something other than what the box held.
    const addReply = addExchange(document.body.dataset.sendmangle ? t.slice(1) : t, false);
    box.innerHTML = EMPTY;
    setAction('stop');
    setTimeout(() => { addReply(); if (!document.body.dataset.streaming) setAction('voice'); }, 400);
  }
  box.addEventListener('input', (e) => {
    if (document.body.dataset.richtext && /^insert/.test(e.inputType || '')) {
      // TEST HOOK: a box with typography and markdown shortcuts — a straight
      // apostrophe is curled, a "- " line becomes a bullet (no marker in its text).
      const parts = (box.innerText || '').split(/\n+/).filter(Boolean);
      box.replaceChildren();
      let ul = null;
      for (const raw of parts) {
        const line = raw.split("'").join(String.fromCharCode(0x2019));
        const p = document.createElement('p');
        if (/^- /.test(line)) {
          if (!ul) { ul = document.createElement('ul'); box.appendChild(ul); }
          const li = document.createElement('li');
          p.textContent = line.slice(2); li.appendChild(p); ul.appendChild(li);
        } else {
          ul = null; p.textContent = line; box.appendChild(p);
        }
      }
    }
    const n = parseInt(document.body.dataset.mangle || '0', 10);
    if (n > 0 && /^insert/.test(e.inputType || '')) {
      document.body.dataset.mangle = String(n - 1);
      const p = document.createElement('p');
      p.textContent = text().slice(1);
      box.replaceChildren(p);
    }
    setAction(text() ? 'send' : 'voice');
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send('enter'); }
  });
  slot.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b && b.getAttribute('aria-label') === 'Send') { e.preventDefault(); send('button'); }
  });
  document.querySelector('form').addEventListener('submit', (e) => e.preventDefault());

  // The reply's markdown, as a Copy button hands it out: headings, paragraphs,
  // links, code blocks, and lists with their numbers and bullets WRITTEN (the page
  // draws them; they are not in its text).
  function replyMarkdown(root) {
    const inline = (n) => [...n.childNodes].map((c) => c.nodeType === 3 ? c.textContent
      : c.tagName === 'A' ? '[' + c.textContent + '](' + c.getAttribute('href') + ')'
      : c.tagName === 'BUTTON' ? '' : inline(c)).join('');
    return [...root.children].map((c) => /^H[1-6]$/.test(c.tagName)
      ? '#'.repeat(parseInt(c.tagName[1], 10)) + ' ' + c.textContent
      : c.tagName === 'PRE' ? '```\n' + (c.querySelector('code') || c).textContent + '\n```'
      : c.tagName === 'OL' ? [...c.children].map((li, i) => (i + 1) + '. ' + inline(li)).join('\n')
      : c.tagName === 'UL' ? [...c.children].map((li) => '- ' + inline(li)).join('\n')
      : inline(c)).join('\n\n');
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (!b.closest('form')) document.body.dataset.clicked = (document.body.dataset.clicked || '')
      + (b.dataset.srName || b.getAttribute('aria-label') || '') + '|';
    if (b.dataset.srAct !== 'copy') return;
    const root = b.closest('.block-BQZwFn').querySelector('[data-selected-text-overlay-target]');
    const users = document.querySelectorAll('[data-user-message-bubble="true"]');
    const gives = document.body.dataset.copyGives || '';
    if (gives === 'nothing') return;
    const t = gives === 'prompt' ? users[users.length - 1].innerText
      : replyMarkdown(root) + (gives === 'cited'
        ? ' ' + String.fromCharCode(0xe200) + 'cite' + String.fromCharCode(0xe202)
          + 'turn0search1' + String.fromCharCode(0xe201) : '');
    // A clipboard write lands a moment after the click, not with it.
    setTimeout(() => navigator.clipboard.writeText(t), 150);
  }, true);

  const menuOpen = () => !!layer.firstElementChild;
  function openMenu() {
    layer.replaceChildren(clone('sr-menu'));
    modelBtn.setAttribute('aria-expanded', 'true');
    modelBtn.setAttribute('data-state', 'open');
    layer.querySelector('[role="menu"]').focus();
  }
  function closeMenu() {
    layer.replaceChildren();
    modelBtn.setAttribute('aria-expanded', 'false');
    modelBtn.setAttribute('data-state', 'closed');
  }
  modelBtn.addEventListener('click', () => { if (menuOpen()) closeMenu(); else openMenu(); });
  document.addEventListener('keydown', (e) => {
    // The capture: Escape closes the menu and focus lands on the model button.
    if (e.key === 'Escape' && menuOpen()) {
      closeMenu(); modelBtn.focus(); document.body.dataset.menuClosedBy = 'escape';
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (menuOpen() && !layer.contains(e.target) && e.target !== modelBtn) {
      closeMenu(); document.body.dataset.menuClosedBy = 'outside';
    }
  }, true);

  if (document.body.dataset.srFixture === 'thread') {
    addExchange(document.body.dataset.srPrompt || 'hello', true);
    setAction('stop');
  }
})();
</script>
