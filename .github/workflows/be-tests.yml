name: Backend Tests

# Runs BOTH pytest suites on every backend change so a regression is caught before
# merge — the BE counterpart to the FE's firestore-rules gate, satisfying the
# git-workflow "verify CI passes after every push" rule. Two suites, because the
# repo holds two packages: `superresearch` (root tests/) and `superresearch-agent`
# (agent/tests/). A gate that runs one and reports for both is worse than no gate.
#
# STYLE lint stays local, not a CI gate — that policy is unchanged and deliberate.
# DGOPS-9508 added one narrow exception: a CORRECTNESS floor (syntax errors +
# undefined names, run with a pinned ruff). Those are latent crashes rather than
# style opinions, and two of them had been sitting in the tree unnoticed. Nothing
# here fails a build over formatting.

# `**.py` covers agent/ too, so an agent-only edit fires this workflow — which is
# exactly why the agent suite has to run below. The requirements/pyproject entries
# are listed per-directory: a bare `requirements.txt` filter matches ONLY the root
# file, so `agent/requirements.txt` needs its own line or a dependency bump there
# would land without ever running the tests that depend on it.
#
# The two trigger lists must stay IDENTICAL. This file is itself a trigger path so
# that narrowing the gate — dropping the agent step, moving the Python version,
# trimming a filter — is a change the gate runs on; it was in `push` but missing
# from `pull_request`, so exactly that edit could be reviewed with no CI at all.
# test_ci_gate_covers_both_suites.py now compares the lists per-trigger rather than
# grepping the whole file, which is why the asymmetry survived a guard that already
# asserted these filters existed.
on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "agent/requirements.txt"
      - "agent/requirements-dev.txt"
      - "agent/pyproject.toml"
      - ".github/workflows/be-tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "agent/requirements.txt"
      - "agent/requirements-dev.txt"
      - "agent/pyproject.toml"
      - ".github/workflows/be-tests.yml"
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # The suite drives no real browser, network or Firestore — so no
      # `patchright install chrome`. It DOES need ffmpeg/ffprobe: the audio
      # sniffer asks a probe whether a file is audio-with-no-video, and the tests
      # that matter most build REAL media to ask it with. Without ffmpeg those
      # tests SKIP, which is how a suite that was written precisely because
      # "stubs cannot prove this" ran green here for a fortnight proving nothing.
      - name: Install ffmpeg (the audio sniffer probes with it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pinned exactly, matching both pyproject.toml dev extras — an unpinned
      # install would let rule implementations move on ruff's release cadence, so
      # CI and a developer's machine could disagree about a clean tree.
      - name: Install ruff (pinned)
        run: pip install ruff==0.16.0

      # Syntax errors and undefined names ONLY — deliberately not a full lint run.
      # `--ignore-noqa` is load-bearing: a `# noqa` on the offending line would
      # otherwise silence a genuine NameError and leave this step green.
      - name: Lint — correctness floor (must be zero)
        run: ruff check . --select E9,F821,F822,F823,F811,F402 --ignore-noqa

      - name: Run tests
        run: python -m pytest tests/ -q

      # The agent is a SECOND package with its own suite, its own dependency file
      # and its own pytest config — root `pytest tests/` never enters agent/, so
      # without this step editing agent/facade/*.py fired the workflow above and
      # reported green while running none of that file's tests.
      #
      # `working-directory: agent` is load-bearing twice over: it picks up
      # agent/pyproject.toml's `testpaths`, and `python -m` puts agent/ on sys.path
      # so `import facade` resolves. Deps are installed explicitly rather than
      # relying on the root file happening to carry compatible floors for them.
      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent tests
        run: python -m pytest tests -q
        working-directory: agent
